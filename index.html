<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Futebol - Stats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root {
    --bg: #081018;
    --bg-secondary: #0d1722;
    --card: #14202c;
    --card-hover: #182735;

    --border: #26394b;

    --text: #d8dee6;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;

    --green: #35c77a;
    --green-dark: #1f8f58;

    --blue: #48a9e6;
    --red: #ef6461;
    --orange: #f0a54a;
    --purple: #9b7ede;

    --radius: 18px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #0b131d 0%,
            #081018 100%
        );

    color: var(--text);
}

button,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1600px;
    margin: auto;
    padding: 28px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 28px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-icon {
    width: 56px;
    height: 56px;

    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;

    background:
        linear-gradient(
            135deg,
            #2bbf70,
            #137a46
        );

    box-shadow:
        0 8px 30px rgba(35, 180, 103, .25);
}

.brand h1 {
    margin: 0;
    font-size: 28px;
}

.brand p {
    margin: 3px 0 0;
    color: var(--text-secondary);
    font-size: 14px;
}

.header-info {
    text-align: right;
}

.header-info strong {
    display: block;
    font-size: 14px;
}

.header-info span {
    color: var(--text-secondary);
    font-size: 12px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 30px;

    padding: 26px;

    border-radius: var(--radius);

    background:
        linear-gradient(
            110deg,
            rgba(27, 77, 64, .75),
            rgba(14, 30, 37, .95)
        );

    border: 1px solid rgba(43, 150, 104, .35);

    margin-bottom: 24px;
}

.hero h2 {
    margin: 0;
    font-size: 24px;
}

.hero p {
    margin: 8px 0 0;
    color: var(--text-secondary);
}

.hero-stats {
    display: flex;
    gap: 34px;
}

.hero-stat {
    text-align: center;
}

.hero-stat-value {
    font-size: 28px;
    font-weight: 800;
}

.hero-stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}


/* =========================================================
   CONTROLES
========================================================= */

.controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;
    margin-bottom: 18px;
}

.context-tabs,
.nav-tabs {
    display: flex;
    gap: 8px;
}

.context-tabs button,
.nav-tabs button {
    border: 1px solid var(--border);
    background: #101a25;
    color: var(--text-secondary);

    padding: 11px 20px;

    border-radius: 10px;

    transition: .2s;
}

.context-tabs button:hover,
.nav-tabs button:hover {
    background: #172432;
}

.context-tabs button.active,
.nav-tabs button.active {
    color: #062514;
    background: var(--green);
    border-color: var(--green);
    font-weight: 700;
}

.nav-tabs {
    flex-wrap: wrap;
    margin-bottom: 28px;
}

.nav-tabs button {
    padding: 12px 20px;
}

.sort-select {
    background: #101a25;
    color: var(--text);

    border: 1px solid var(--border);

    padding: 12px 16px;

    border-radius: 12px;
}


/* =========================================================
   TABS
========================================================= */

.tab {
    display: none;
}

.tab.active {
    display: block;
}


/* =========================================================
   KPI CARDS
========================================================= */

.kpi-grid {
    display: grid;
    grid-template-columns:
        repeat(6, minmax(0, 1fr));

    gap: 14px;

    margin-bottom: 26px;
}

.kpi-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 18px;
}

.kpi-label {
    color: var(--text-secondary);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: .8px;
}

.kpi-value {
    margin-top: 10px;

    font-size: 26px;
    font-weight: 800;
}


/* =========================================================
   SECTION
========================================================= */

.section-title {
    margin: 26px 0 4px;

    font-size: 22px;
}

.section-subtitle {
    margin: 0 0 16px;
    color: var(--text-secondary);
}


/* =========================================================
   RANKING GRID
========================================================= */

.ranking-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 18px;
}

.ranking-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    overflow: hidden;
}

.ranking-header {
    padding: 18px 20px;

    display: flex;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}

.ranking-header h3 {
    margin: 0;
}

.ranking-context {
    color: var(--text-secondary);
    font-size: 12px;
}

.ranking-list {
    padding: 10px 18px 16px;
}

.ranking-item {
    display: grid;

    grid-template-columns:
        32px 34px 1fr 60px;

    align-items: center;

    gap: 10px;

    padding: 10px 0;
}

.rank-number {
    color: var(--text-secondary);
    font-size: 13px;
    text-align: center;
}

.team-logo-small {
    width: 30px;
    height: 30px;

    object-fit: contain;
}

.team-name {
    font-weight: 600;
    font-size: 14px;
}

.ranking-value {
    text-align: right;
    font-weight: 700;
}

.progress-wrap {
    margin-top: 6px;
}

.progress {
    height: 5px;

    background: #081018;

    border-radius: 8px;

    overflow: hidden;
}

.progress > div {
    height: 100%;
    border-radius: 8px;

    background:
        linear-gradient(
            90deg,
            #2ebd72,
            #4ad58d
        );
}


/* =========================================================
   TABLES
========================================================= */

.table-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    background: #111c27;
}

th {
    padding: 14px 16px;

    text-align: left;

    color: var(--text-secondary);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: .7px;
}

td {
    padding: 14px 16px;

    border-top: 1px solid var(--border);

    font-size: 14px;
}

tr.team-row {
    cursor: pointer;
}

tr.team-row:hover {
    background: rgba(255,255,255,.025);
}

.team-cell {
    display: flex;
    align-items: center;
    gap: 10px;
}

.metric-positive {
    color: var(--green);
}

.metric-negative {
    color: var(--red);
}

.metric-blue {
    color: var(--blue);
}


/* =========================================================
   CHARTS
========================================================= */

.chart-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 20px;
}

.chart-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 20px;

    min-height: 380px;
}

.chart-card h3 {
    margin: 0;
}

.chart-card p {
    margin-top: 5px;
    color: var(--text-secondary);
    font-size: 14px;
}

.chart-container {
    position: relative;
    height: 290px;
}


/* =========================================================
   EQUIPES
========================================================= */

.teams-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));

    gap: 14px;
}

.team-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 18px;

    cursor: pointer;

    transition: .2s;
}

.team-card:hover {
    transform: translateY(-2px);

    background: var(--card-hover);

    border-color: #3a566c;
}

.team-card-top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.team-logo {
    width: 44px;
    height: 44px;

    object-fit: contain;
}

.team-card h3 {
    margin: 0;
}

.team-card small {
    color: var(--text-secondary);
}

.team-card-stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 18px;
}

.team-mini-stat {
    text-align: center;
}

.team-mini-stat strong {
    display: block;
    font-size: 16px;
}

.team-mini-stat span {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
}


/* =========================================================
   COMPARAR PARTIDA
========================================================= */

.compare-selectors {
    display: grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items: end;

    gap: 18px;

    margin-bottom: 24px;
}

.compare-select-group label {
    display: block;

    margin-bottom: 8px;

    color: var(--text-secondary);

    font-size: 12px;

    text-transform: uppercase;
}

.compare-select-group select {
    width: 100%;

    background: var(--card);

    color: var(--text);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 14px;
}

.vs {
    font-size: 22px;
    font-weight: 800;

    color: var(--text-secondary);

    padding-bottom: 10px;
}

.match-prediction {
    background:
        linear-gradient(
            110deg,
            rgba(22, 47, 59, .95),
            rgba(13, 35, 31, .95)
        );

    border: 1px solid #234b50;

    border-radius: 22px;

    padding: 28px;

    margin-bottom: 28px;
}

.prediction-teams {
    display: grid;

    grid-template-columns:
        1fr 200px 1fr;

    align-items: center;

    text-align: center;
}

.prediction-team-name {
    font-size: 18px;
    font-weight: 700;
}

.prediction-xg {
    font-size: 48px;
    font-weight: 900;
    margin: 8px 0;
}

.prediction-label {
    color: var(--text-secondary);
    font-size: 13px;
}

.prediction-center {
    text-align: center;
}

.prediction-center strong {
    font-size: 24px;
}

.prediction-center span {
    display: block;
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 5px;
}

.prediction-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;

    margin-top: 24px;
}

.prediction-card {
    background: rgba(5, 14, 21, .6);

    border: 1px solid #223746;

    border-radius: 14px;

    padding: 18px;

    text-align: center;
}

.prediction-card-label {
    color: var(--text-secondary);
    font-size: 12px;
    text-transform: uppercase;
}

.prediction-card-value {
    font-size: 28px;
    font-weight: 800;
    margin-top: 8px;
}

.market-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 14px;
}

.market-card {
    background:
        linear-gradient(
            145deg,
            #102722,
            #101b26
        );

    border: 1px solid #194b3b;

    border-radius: 16px;

    padding: 20px;

    text-align: center;
}

.market-card strong {
    display: block;
    margin-top: 10px;

    font-size: 28px;
}

.market-card span {
    color: var(--text-secondary);
    font-size: 12px;
}


/* =========================================================
   HISTÓRICO
========================================================= */

.history-trend-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;

    margin-bottom: 28px;
}

.trend-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 20px;
}

.trend-label {
    color: var(--text-secondary);

    font-size: 12px;

    text-transform: uppercase;
}

.trend-status {
    margin-top: 10px;

    font-size: 24px;

    font-weight: 800;
}

.trend-status.good {
    color: var(--green);
}

.trend-status.bad {
    color: var(--red);
}

.trend-status.neutral {
    color: var(--orange);
}

.trend-description {
    margin-top: 6px;
    color: var(--text-secondary);
}


/* =========================================================
   TEAM DETAIL MODAL
========================================================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.72);

    z-index: 999;

    padding: 30px;

    overflow-y: auto;
}

.modal.open {
    display: block;
}

.modal-content {
    max-width: 1250px;

    margin: 30px auto;

    background: #0d1722;

    border: 1px solid var(--border);

    border-radius: 22px;

    overflow: hidden;
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 24px;

    border-bottom: 1px solid var(--border);
}

.modal-team {
    display: flex;

    align-items: center;

    gap: 18px;
}

.modal-team img {
    width: 70px;
    height: 70px;
    object-fit: contain;
}

.modal-team h2 {
    margin: 0;
}

.close-modal {
    background: transparent;

    color: var(--text-secondary);

    border: none;

    font-size: 28px;
}

.modal-body {
    padding: 24px;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    padding: 100px 20px;
    text-align: center;

    color: var(--text-secondary);
}

.error {
    margin: 40px auto;
    max-width: 700px;

    padding: 25px;

    border-radius: 16px;

    background: rgba(239,100,97,.1);

    border: 1px solid rgba(239,100,97,.35);

    color: #ffaaa7;
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 1100px) {

    .kpi-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .hero {
        flex-direction: column;
        align-items: flex-start;
    }

    .ranking-grid,
    .chart-grid {
        grid-template-columns: 1fr;
    }

    .market-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media (max-width: 760px) {

    .app {
        padding: 16px;
    }

    .header {
        align-items: flex-start;
        gap: 15px;
    }

    .header-info {
        display: none;
    }

    .hero-stats {
        width: 100%;
        justify-content: space-between;
        gap: 10px;
    }

    .hero-stat-value {
        font-size: 21px;
    }

    .controls-row {
        flex-direction: column;
        align-items: stretch;
    }

    .context-tabs {
        width: 100%;
    }

    .context-tabs button {
        flex: 1;
    }

    .kpi-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .prediction-teams {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .prediction-grid {
        grid-template-columns: 1fr;
    }

    .compare-selectors {
        grid-template-columns: 1fr;
    }

    .vs {
        text-align: center;
        padding: 0;
    }

    .history-trend-grid {
        grid-template-columns: 1fr;
    }

    .market-grid {
        grid-template-columns: 1fr 1fr;
    }

    .modal {
        padding: 10px;
    }

}

/* Raio-X Técnico & H2H */
.adv-pills {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

.adv-pill {
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.adv-pill:hover {
    border-color: var(--green);
    color: #fff;
}

.adv-pill.active {
    background: var(--green);
    color: #0b1118;
    border-color: var(--green);
}

.th-sortable {
    cursor: pointer;
    user-select: none;
    transition: color .2s ease;
}

.th-sortable:hover {
    color: var(--green);
}

.compare-h2h-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 20px;
}

.compare-h2h-item {
    background: #0f1822;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
}

.compare-h2h-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin-bottom: 10px;
}

.compare-h2h-values {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: 700;
}

.compare-h2h-bar {
    display: flex;
    height: 6px;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
    background: rgba(255,255,255,0.06);
}

.compare-h2h-bar-home {
    background: var(--green);
    transition: width .3s ease;
}

.compare-h2h-bar-away {
    background: var(--blue);
    transition: width .3s ease;
}


.header-selectors {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.header-selectors .sort-select {
    min-width: 130px;
}

@media (max-width: 700px) {
    .header-selectors {
        justify-content: flex-start;
    }
    .header-selectors .sort-select {
        flex: 1;
        min-width: 0;
    }
}

</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>
                <h1>Futebol - Estatísticas</h1>

                <p>
                    🏆 Gols, mercados e xG 🥇
                </p>
            </div>

        </div>


        <div class="header-info">

            <strong id="leagueTitle">
                Campeonato Brasileiro Série A 2026
            </strong>

            <span id="updatedAt">
                Carregando dados...
            </span>

            <div class="header-selectors">
                <select id="leagueSelector" class="sort-select" onchange="changeLeague(this.value)"></select>
                <select id="seasonSelector" class="sort-select" onchange="changeSeason(this.value)"></select>
            </div>

        </div>

    </header>


    <!-- APP -->

    <main id="app">

        <div class="loading">
            Carregando estatísticas...
        </div>

    </main>

</div>


<!-- MODAL -->

<div id="teamModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <div id="modalTeamHeader"></div>

            <button
                class="close-modal"
                onclick="closeTeamModal()"
            >
                ×
            </button>

        </div>

        <div
            id="modalTeamBody"
            class="modal-body"
        ></div>

    </div>

</div>


<script>

/* ============================================================
   CONFIGURAÇÃO
============================================================ */

const LEAGUES = {
    alemanha: { name: "Alemanha", leagueId: 54, defaultSeason: "2026/27" },
    alemanha2: { name: "Alemanha 2a Div", leagueId: 146, defaultSeason: "2026/27" },
    espanha: { name: "Espanha", leagueId: 87, defaultSeason: "2026/27" },
    espanha2: { name: "Espanha 2a Div", leagueId: 140, defaultSeason: "2026/27" },
    franca: { name: "França", leagueId: 53, defaultSeason: "2026/27" },
    franca2: { name: "França 2a Div", leagueId: 110, defaultSeason: "2026/27" },
    italia: { name: "Itália", leagueId: 55, defaultSeason: "2026/27" },
    italia2: { name: "Itália 2a Div", leagueId: 86, defaultSeason: "2026/27" },
    inglaterra: { name: "Inglaterra", leagueId: 47, defaultSeason: "2026/27" },
    inglaterra2: { name: "Inglaterra 2a Div", leagueId: 48, defaultSeason: "2026/27" },
    belgica: { name: "Bélgica", leagueId: 40, defaultSeason: "2026/27" },
    holanda: { name: "Holanda", leagueId: 57, defaultSeason: "2026/27" },
    portugal: { name: "Portugal", leagueId: 61, defaultSeason: "2026/27" },
    turquia: { name: "Turquia", leagueId: 71, defaultSeason: "2026/27" },
    grecia: { name: "Grécia", leagueId: 135, defaultSeason: "2026/27" },
    escocia: { name: "Escócia", leagueId: 64, defaultSeason: "2026/27" },
    dinamarca: { name: "Dinamarca", leagueId: 46, defaultSeason: "2026" },
    noruega: { name: "Noruega", leagueId: 59, defaultSeason: "2026" },
    suica: { name: "Suíça", leagueId: 69, defaultSeason: "2026/27" },
    suecia: { name: "Suécia", leagueId: 67, defaultSeason: "2026" },
    brasil: { name: "Brasil - Série A", leagueId: 268, defaultSeason: "2026" },
    brasil2: { name: "Brasil - Série B", leagueId: 8814, defaultSeason: "2026" },
    mexico: { name: "México", leagueId: 230, defaultSeason: "2026" }

function getNormalizedTeamId(team) {
    if (!team) return null;

    let name = team;
    if (typeof team === "object") {
        if (team.id) return team.id;
        if (team.team_id) return team.team_id;
        if (team.team?.id) return team.team.id;
        name = team.team || team.name || "";
    }

    const clean = String(name).trim();
    const norm = clean.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

    // Primeiro tenta o próprio objeto da liga atual.
    for (const item of Object.values(APP_DATA?.teams || {})) {
        const itemName = item?.team || item?.name || "";
        const itemNorm = String(itemName).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        if (itemNorm === norm) {
            if (item?.id) return item.id;
            if (item?.team_id) return item.team_id;
            if (item?.fotmob_id) return item.fotmob_id;
        }
    }

    if (TEAM_IDS[clean]) return TEAM_IDS[clean];

    for (const [key, id] of Object.entries(TEAM_IDS)) {
        if (key.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() === norm) {
            return id;
        }
    }
    return null;
}

============================================================ */

function seasonToFilePart(season) {
    return String(season || "temporada")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, "_")
        .replace(/[^a-zA-Z0-9._-]/g, "");
}

function getDataUrls() {
    const seasonPart = seasonToFilePart(CURRENT_SEASON);
    return {
        stats: `./data/app/${CURRENT_LEAGUE}_stats_${seasonPart}.json`,
        history: `./data/app/${CURRENT_LEAGUE}_historico_${seasonPart}.json`
    };
}

async function loadManifest() {
    const response = await fetch(`./data/app/manifest.json?t=${Date.now()}`, { cache: "no-store" });

    if (!response.ok) {
        throw new Error("Não foi possível carregar data/app/manifest.json");
    }

    APP_MANIFEST = await response.json();

    const manifestLeagues = APP_MANIFEST?.leagues || {};

    // O manifesto passa a ser a fonte oficial de ligas/temporadas disponíveis.
    for (const [slug, item] of Object.entries(manifestLeagues)) {
        if (!LEAGUES[slug]) {
            LEAGUES[slug] = {
                name: item.name || slug,
                leagueId: item.league_id,
                defaultSeason: item.season || ""
            };
        } else if (item.season) {
            LEAGUES[slug].defaultSeason = String(item.season);
        }
    }

    const available = Object.keys(manifestLeagues);
    if (available.length && !available.includes(CURRENT_LEAGUE)) {
        CURRENT_LEAGUE = available.includes("brasil") ? "brasil" : available[0];
    }

    if (LEAGUES[CURRENT_LEAGUE]?.defaultSeason) {
        CURRENT_SEASON = LEAGUES[CURRENT_LEAGUE].defaultSeason;
    }

    localStorage.setItem(STORAGE_LEAGUE, CURRENT_LEAGUE);
    localStorage.setItem(STORAGE_SEASON, CURRENT_SEASON);
}

function getManifestEntry() {
    return APP_MANIFEST?.leagues?.[CURRENT_LEAGUE] || null;
}

function populateSelectors() {
    const leagueSelector = document.getElementById("leagueSelector");
    const seasonSelector = document.getElementById("seasonSelector");
    if (!leagueSelector || !seasonSelector) return;

    const manifestLeagues = APP_MANIFEST?.leagues || {};
    const entries = Object.entries(manifestLeagues).filter(([, item]) => item?.status === "ok" && item?.stats_file);

    const source = entries.length
        ? entries
        : Object.entries(LEAGUES);

    leagueSelector.innerHTML = source
        .map(([slug, cfg]) => `<option value="${slug}">${cfg.name}</option>`)
        .join("");

    if ([...leagueSelector.options].some(o => o.value === CURRENT_LEAGUE)) {
        leagueSelector.value = CURRENT_LEAGUE;
    }

    const entry = getManifestEntry();
    const season = entry?.season || LEAGUES[CURRENT_LEAGUE]?.defaultSeason || CURRENT_SEASON;
    CURRENT_SEASON = String(season);

    seasonSelector.innerHTML = `<option value="${CURRENT_SEASON}">${CURRENT_SEASON}</option>`;
    seasonSelector.value = CURRENT_SEASON;
}

async function loadLeagueData() {
    const entry = getManifestEntry();
    if (!entry?.stats_file) {
        throw new Error(`Não há dados publicados para a liga "${CURRENT_LEAGUE}".`);
    }

    HISTORY_DATA = null;

    const statsUrl = `./data/app/${entry.stats_file}`;
    const historyUrl = entry.history_file ? `./data/app/${entry.history_file}` : null;

    const [statsResponse, historyResponse] = await Promise.all([
        fetch(`${statsUrl}?t=${Date.now()}`, { cache: "no-store" }),
        historyUrl
            ? fetch(`${historyUrl}?t=${Date.now()}`, { cache: "no-store" }).catch(() => null)
            : Promise.resolve(null)
    ]);

    if (!statsResponse.ok) {
        throw new Error(`Não foi possível carregar ${statsUrl}`);
    }

    APP_DATA = await statsResponse.json();

    if (historyResponse?.ok) {
        HISTORY_DATA = await historyResponse.json();
    }

    if (APP_DATA?.season !== undefined && APP_DATA?.season !== null) {
        CURRENT_SEASON = String(APP_DATA.season);
        localStorage.setItem(STORAGE_SEASON, CURRENT_SEASON);
    }
}

async function init() {
    try {
        document.getElementById("app").innerHTML = `<div class="loading">Carregando catálogo de ligas...</div>`;
        await loadManifest();
        populateSelectors();
        await loadLeagueData();
        populateSelectors();
        updateHeader();
        renderApp();
    } catch (error) {
        console.error(error);
        document.getElementById("app").innerHTML = `
            <div class="error">
                <h2>Não foi possível carregar os dados</h2>
                <p>${error.message}</p>
                <p>Verifique se o GitHub Actions já executou a atualização diária e se data/app/manifest.json está publicado.</p>
            </div>`;
    }
}

async function changeLeague(slug) {
    if (!LEAGUES[slug]) return;
    CURRENT_LEAGUE = slug;
    CURRENT_SEASON = APP_MANIFEST?.leagues?.[slug]?.season || LEAGUES[slug].defaultSeason;
    localStorage.setItem(STORAGE_LEAGUE, CURRENT_LEAGUE);
    localStorage.setItem(STORAGE_SEASON, CURRENT_SEASON);
    CURRENT_CONTEXT = "geral";
    destroyAllCharts();
    document.getElementById("app").innerHTML = `<div class="loading">Carregando ${LEAGUES[slug].name}...</div>`;
    try {
        await loadLeagueData();
        populateSelectors();
        updateHeader();
        renderApp();
    } catch (error) {
        console.error(error);
        document.getElementById("app").innerHTML = `<div class="error"><h2>Dados não encontrados</h2><p>${error.message}</p></div>`;
    }
}

async function changeSeason(season) {
    // O catálogo diário publica a temporada atualmente disponível no manifesto.
    CURRENT_SEASON = season;
    localStorage.setItem(STORAGE_SEASON, CURRENT_SEASON);
    destroyAllCharts();
    document.getElementById("app").innerHTML = `<div class="loading">Carregando ${LEAGUES[CURRENT_LEAGUE].name} ${season}...</div>`;
    try {
        await loadLeagueData();
        populateSelectors();
        updateHeader();
        renderApp();
    } catch (error) {
        console.error(error);
        document.getElementById("app").innerHTML = `<div class="error"><h2>Temporada não encontrada</h2><p>${error.message}</p></div>`;
    }
}

function kpi(label, value) {

    return `

        <div class="kpi-card">

            <div class="kpi-label">
                ${label}

                ${value}

function averageMetric(teams, metric) {

    if (!teams.length) return 0;

    const total =
        teams.reduce(
            (sum, team) =>
                sum + number(
                    getStats(team)[metric]
                ),
            0
        );

    return total / teams.length;
}


function renderRankingCard(
    title,
    metric,
    percentage
) {

    const teams =
        getTeamsArray()
        .map(team => ({
            team,
            value: number(
                getStats(team)[metric]
            )
        }))
        .sort(
            (a, b) =>
                b.value - a.value
        )
        .slice(0, 10);


    const max =
        Math.max(
            ...teams.map(x => x.value),
            1
        );


    return `

        <div class="ranking-card">

            <div class="ranking-header">

                <h3>
                    ${title}
                </h3>

                <span class="ranking-context">
                    ${getContextLabel()}

                                    <div class="progress">

                                }

                            </div>

                    `
                ).join("")}

            </div>

        </div>
    `;
}

let CURRENT_ADV_CATEGORY = "shots";
let ADV_SORT_COL = null;
let ADV_SORT_DESC = true;

function changeAdvCategory(cat) {
    CURRENT_ADV_CATEGORY = cat;
    ADV_SORT_COL = null;
    const tabEl = document.getElementById("tab-advanced");
    if (tabEl) {
        tabEl.innerHTML = renderAdvancedStats();
        setTimeout(renderAdvancedCharts, 50);
    }
}

function sortAdvTable(colKey) {
    if (ADV_SORT_COL === colKey) {
        ADV_SORT_DESC = !ADV_SORT_DESC;
    } else {
        ADV_SORT_COL = colKey;
        ADV_SORT_DESC = true;
    }
    const tabEl = document.getElementById("tab-advanced");
    if (tabEl) {
        tabEl.innerHTML = renderAdvancedStats();
        setTimeout(renderAdvancedCharts, 50);
    }
}

function renderAdvancedStats() {
    const teams = getTeamsArray();
    const cat = CURRENT_ADV_CATEGORY;

    let defaultCol = "shots_on_target_avg";
    if (cat === "creation") defaultCol = "possession_avg";
    if (cat === "defense") defaultCol = "tackles_avg";
    if (cat === "xg") defaultCol = "xg";

    const sortCol = ADV_SORT_COL || defaultCol;
    const isDesc = ADV_SORT_DESC;

    const sortedTeams = [...teams].sort((a, b) => {
        const valA = number(getStats(a)[sortCol]);
        const valB = number(getStats(b)[sortCol]);
        return isDesc ? valB - valA : valA - valB;
    });

    const topShotsOnTarget = [...teams].sort((a, b) => number(getStats(b).shots_on_target_avg) - number(getStats(a).shots_on_target_avg))[0];
    const topPossession = [...teams].sort((a, b) => number(getStats(b).possession_avg) - number(getStats(a).possession_avg))[0];
    const topCorners = [...teams].sort((a, b) => number(getStats(b).corners_avg) - number(getStats(a).corners_avg))[0];
    const topTackles = [...teams].sort((a, b) => number(getStats(b).tackles_avg) - number(getStats(a).tackles_avg))[0];
    const topXGOT = [...teams].sort((a, b) => number(getStats(b).xgot) - number(getStats(a).xgot))[0];
    const topFewestShotsConc = [...teams].sort((a, b) => number(getStats(a).shots_conceded_avg) - number(getStats(b).shots_conceded_avg))[0];

    const th = (label, col) => {
        const isCurrent = sortCol === col;
        const arrow = isCurrent ? (isDesc ? " ↓" : " ↑") : "";
        const style = isCurrent ? "color:var(--green); font-weight:700;" : "";
        return `<th class="th-sortable" style="${style}" onclick="sortAdvTable('${col}')" title="Clique para ordenar">${label}${arrow}</th>`;
    };

    let kpisHtml = "";
    if (cat === "shots") {
        kpisHtml = `
            ${kpi("Mais Chutes no Gol", `${topShotsOnTarget.team} (${formatNumber(getStats(topShotsOnTarget).shots_on_target_avg, 2)}/j)`)}
            ${kpi("Maior xGOT (Qualidade)", `${topXGOT.team} (${formatNumber(getStats(topXGOT).xgot, 2)}/j)`)}
            ${kpi("Média Chutes/Jogo", formatNumber(averageMetric(teams, "shots_total_avg"), 2))}
            ${kpi("Média Chutes no Gol", formatNumber(averageMetric(teams, "shots_on_target_avg"), 2))}
        `;
    } else if (cat === "creation") {
        kpisHtml = `
            ${kpi("Maior Posse de Bola", `${topPossession.team} (${formatNumber(getStats(topPossession).possession_avg, 1)}%)`)}
            ${kpi("Mais Escanteios", `${topCorners.team} (${formatNumber(getStats(topCorners).corners_avg, 2)}/j)`)}
            ${kpi("Média Posse da Liga", "50.0%")}
            ${kpi("Média Escanteios/Jogo", formatNumber(averageMetric(teams, "corners_total_avg"), 2))}
        `;
    } else if (cat === "defense") {
        kpisHtml = `
            ${kpi("Mais Desarmes", `${topTackles.team} (${formatNumber(getStats(topTackles).tackles_avg, 2)}/j)`)}
            ${kpi("Menos Chutes Cedidos", `${topFewestShotsConc.team} (${formatNumber(getStats(topFewestShotsConc).shots_conceded_avg, 2)}/j)`)}
            ${kpi("Média Desarmes/Jogo", formatNumber(averageMetric(teams, "tackles_avg"), 2))}
            ${kpi("Média Intercepções", formatNumber(averageMetric(teams, "interceptions_avg"), 2))}
        `;
    } else {
        const topOpenPlay = [...teams].sort((a, b) => number(getStats(b).xg_open_play) - number(getStats(a).xg_open_play))[0];
        const topSetPlay = [...teams].sort((a, b) => number(getStats(b).xg_set_play) - number(getStats(a).xg_set_play))[0];
        kpisHtml = `
            ${kpi("Top xG Jogada Normal", `${topOpenPlay.team} (${formatNumber(getStats(topOpenPlay).xg_open_play, 2)}/j)`)}
            ${kpi("Top Bola Parada", `${topSetPlay.team} (${formatNumber(getStats(topSetPlay).xg_set_play, 2)}/j)`)}
            ${kpi("Top xGOT (Alvo)", `${topXGOT.team} (${formatNumber(getStats(topXGOT).xgot, 2)}/j)`)}
            ${kpi("Média xG/Jogo Liga", "2.59")}
        `;
    }

    return `
        <h2 class="section-title">
            Raio-X Técnico: Métricas Avançadas
        </h2>
        <p class="section-subtitle">
            Análise detalhada de finalizações, posse, criação, defesa e xG extraídos partida a partida da temporada 2026.
        </p>

        <div class="adv-pills">
            <button class="adv-pill ${cat === 'shots' ? 'active' : ''}" onclick="changeAdvCategory('shots')">
                🎯 Finalizações & Chutes
            </button>
            <button class="adv-pill ${cat === 'creation' ? 'active' : ''}" onclick="changeAdvCategory('creation')">
                ⚽ Posse & Criação
            </button>
            <button class="adv-pill ${cat === 'defense' ? 'active' : ''}" onclick="changeAdvCategory('defense')">
                🛡️ Defesa & Disciplina
            </button>
            <button class="adv-pill ${cat === 'xg' ? 'active' : ''}" onclick="changeAdvCategory('xg')">
                📈 Gols Esperados (xG)
            </button>
        </div>

        <div class="kpi-grid">
            ${kpisHtml}
        </div>

        <div class="chart-grid">
            <div class="chart-card">
                <h3 id="advChart1Title">Destaques da Categoria</h3>
                <p id="advChart1Subtitle">Top 10 equipes no fundamento</p>
                <div class="chart-container">
                    <canvas id="chartAdv1"></canvas>

            </div>
            <div class="chart-card">

/* ============================================================
   MODELO POISSON
============================================================ */

function poisson(k, lambda) {

    let factorial = 1;

    for (
        let i = 2;
        i <= k;
        i++
    ) {

        factorial *= i;
    }

    return (
        Math.pow(lambda, k) *
        Math.exp(-lambda)
    ) / factorial;
}


function calculateMatchPrediction(
    home,
    away
) {

    /*
       Mandante:
       ataque em casa

       Visitante:
       defesa fora
    */

    const homeAttack =
        number(home.mandante?.xg);

    const homeDefense =
        number(home.mandante?.xga);


    const awayAttack =
        number(away.visitante?.xg);

    const awayDefense =
        number(away.visitante?.xga);


    /*
       Cruzamento ofensivo x defensivo
    */

    let lambdaHome =
        (homeAttack + awayDefense) / 2;

    let lambdaAway =
        (awayAttack + homeDefense) / 2;


    /*
       Fallback caso não existam dados específicos
    */

    if (lambdaHome <= 0) {

        lambdaHome =
            (
                number(home.geral.xg) +
                number(away.geral.xga)
            ) / 2;
    }


    if (lambdaAway <= 0) {

        lambdaAway =
            (
                number(away.geral.xg) +
                number(home.geral.xga)
            ) / 2;
    }


    const totalExpected =
        lambdaHome + lambdaAway;


    let homeWin = 0;
    let draw = 0;
    let awayWin = 0;

    let mostLikely = {
        home: 0,
        away: 0,
        probability: 0
    };


    for (
        let homeGoals = 0;
        homeGoals <= 7;
        homeGoals++
    ) {

        for (
            let awayGoals = 0;
            awayGoals <= 7;
            awayGoals++
        ) {

            const probability =
                poisson(
                    homeGoals,
                    lambdaHome
                )
                *
                poisson(
                    awayGoals,
                    lambdaAway
                );


            if (
                homeGoals > awayGoals
            ) {

                homeWin += probability;

            }
            else if (
                homeGoals === awayGoals
            ) {

                draw += probability;

            }
            else {

                awayWin += probability;
            }


            if (
                probability >
                mostLikely.probability
            ) {

                mostLikely = {

                    home: homeGoals,

                    away: awayGoals,

                    probability
                };
            }
        }
    }


    let over05 = 0;
    let over15 = 0;
    let over25 = 0;
    let over35 = 0;
    let under25 = 0;
    let btts = 0;


    for (
        let h = 0;
        h <= 7;
        h++
    ) {

        for (
            let a = 0;
            a <= 7;
            a++
        ) {

            const p =
                poisson(h, lambdaHome)
                *
                poisson(a, lambdaAway);

            const total = h + a;

            if (total >= 1) over05 += p;
            if (total >= 2) over15 += p;
            if (total >= 3) over25 += p;
            if (total >= 4) over35 += p;
            if (total <= 2) under25 += p;

            if (h > 0 && a > 0) {
                btts += p;
            }
        }
    }


    return {

        lambdaHome,
        lambdaAway,

        totalExpected,

        homeWin:
            homeWin * 100,

        draw:
            draw * 100,

        awayWin:
            awayWin * 100,

        over05:
            over05 * 100,

        over15:
            over15 * 100,

        over25:
            over25 * 100,

        over35:
            over35 * 100,

        under25:
            under25 * 100,

        btts:
            btts * 100,

        mostLikely: {

            ...mostLikely,

            probability:
                mostLikely.probability * 100
        }
    };
}

function h2hBarCard(title, homeName, awayName, valHome, valAway, unit = "", decimals = 2, showTotal = false) {
    const numH = number(valHome);
    const numA = number(valAway);
    const sum = numH + numA;
    const pctH = sum > 0 ? Math.round((numH / sum) * 100) : 50;
    const pctA = sum > 0 ? (100 - pctH) : 50;
    const totalText = showTotal ? ` <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">(Total: ${formatNumber(sum, decimals)})</span>` : "";

    return `
        <div class="compare-h2h-item">
            <div class="compare-h2h-header">
                <span>${title}${totalText}</span>
            </div>
            <div class="compare-h2h-values">
                <span style="color:var(--green);">${formatNumber(numH, decimals)}${unit}</span>
                <span style="color:var(--blue);">${formatNumber(numA, decimals)}${unit}</span>
            </div>
            <div class="compare-h2h-bar">
                <div class="compare-h2h-bar-home" style="width:${pctH}%;"></div>
                <div class="compare-h2h-bar-away" style="width:${pctA}%;"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-top:6px;">
                <span>${homeName} (${pctH}%)</span>
                <span>${awayName} (${pctA}%)</span>
            </div>
        </div>
    `;
}

function trendCard(
    title,
    trend
) {

    const status =
        trend?.status || "Sem dados";


    let cssClass =
        "neutral";


    if (status === "Melhorando") {
        cssClass = "good";
    }

    if (status === "Piorando") {
        cssClass = "bad";
    }


    const variation =
        number(trend?.variacao);


    return `

        <div class="trend-card">

            <div class="trend-label">
                ${title}
            </div>

            <div
                class="trend-status ${cssClass}"
            >
                ${
                    status === "Melhorando"
                        ? "↑"
                        : status === "Piorando"
                            ? "↓"
                            : "→"
                }

                ${status}

            </div>

            <div class="trend-description">

                Últimos 5 vs temporada
                (${formatNumber(
                    Math.abs(variation),
                    1
                )}%)

            </div>

        </div>
    `;
}

    destroyChart("historyXG");


    charts.historyXG =

function detailMetric(

                    text-transform:uppercase;
                "
            >
                ${label}
            </div>

                style="
                    display:block;
                    font-size:22px;
                    margin-top:8px;
                "
            >
                ${value}
            </strong>

        </div>
    `;
}


function contextComparisonRow(
    team,
    label,
    metric,
    percentage = false
) {

    const geral =
        team.geral?.[metric];

    const mandante =
        team.mandante?.[metric];

    const visitante =
        team.visitante?.[metric];


    const formatter =
        value =>
            percentage
                ? formatPercent(value)
                : (
                    metric === "games"
                        ? number(value)
                        : formatNumber(value, 2)
                );


    return `

        <tr>

            <td>
                ${label}
            </td>

            <td>
                ${formatter(geral)}
            </td>

            <td>
                ${formatter(mandante)}
            </td>

            <td>
                ${formatter(visitante)}
            </td>

        </tr>
    `;
}

============================================================ */

function openTab(tabName) {

    document
        .querySelectorAll(".tab")
        .forEach(tab =>
            tab.classList.remove("active")
        );


    document
        .querySelectorAll(".nav-tabs button")
        .forEach(button =>
            button.classList.remove("active")
        );


    document
        .getElementById(`tab-${tabName}`)
        .classList.add("active");


    document
        .querySelector(
            `.nav-tabs button[data-tab="${tabName}"]`
        )
        .classList.add("active");


    setTimeout(() => {

        if (tabName === "goals") {

            renderGoalsCharts();
        }

        if (tabName === "xg") {

            renderXGCharts();
        }

        if (tabName === "compare") {

            updateComparison();
        }

        if (
            tabName === "history" &&
            HISTORY_DATA
        ) {

            updateHistory();
        }

        if (tabName === "advanced") {

            renderAdvancedCharts();
        }

    }, 50);
}

/* ============================================================
   UTILITÁRIOS FINAIS
============================================================ */

function escapeQuote(value) {

    return String(value)
        .replace(/'/g, "\\'");
}


function formatDate(value) {

    if (!value) return "-";

    const date =
        new Date(value);

    if (
        Number.isNaN(date.getTime())
    ) {
        return value;
    }

    return date.toLocaleDateString(
        "pt-BR"
    );
}
