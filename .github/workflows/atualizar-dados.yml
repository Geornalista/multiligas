name: Atualizar dados FotMob

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados-fotmob
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Atualizar todas as ligas
        run: node update-all.js

      - name: Verificar arquivos gerados
        run: |
          test -f data/app/manifest.json
          find data/app -maxdepth 1 -type f -name '*.json' -print | sort

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit e push dos dados
        run: |
          git add data/app/*.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
            exit 0
          fi
          git commit -m "Atualiza dados das ligas"
          git push
